name: Connect a phone / save alert settings

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: tt-subscribe
  cancel-in-progress: false

jobs:
  subscribe:
    # Only the repository owner can connect phones.
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, 'Subscribe') || startsWith(github.event.issue.title, 'Settings'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Save subscription
        if: startsWith(github.event.issue.title, 'Subscribe')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python add_subscription.py
      - name: Save alert settings
        if: startsWith(github.event.issue.title, 'Settings')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python save_prefs.py
      - name: Commit
        run: |
          git config user.name "tt-monitor"
          git config user.email "actions@users.noreply.github.com"
          for f in subscriptions.json alert_prefs.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Update from app" && git pull --rebase && git push)
      - name: Send test alert
        if: startsWith(github.event.issue.title, 'Subscribe')
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python monitor.py --test-alert
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "✅ Done. Your phone/settings are saved."
      - name: Run a full check now
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml -R ${{ github.repository }} -f mode=normal
