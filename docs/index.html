<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TT Deals</title>
<meta name="description" content="Table tennis specials from Table Tennis 11, Racketlon, Megaspin, Dandoy, Butterfly, JOOLA, Donic and STIGA - in rand.">
<meta name="theme-color" content="#101B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TT Deals">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --navy: #101B2D; --navy-2: #1B2A42; --red: #E63946; --red-soft: #FDECEE;
    --ink: #121826; --muted: #6B7385; --line: #E6E9EF; --bg: #F3F5F8; --card: #FFFFFF;
    --green: #12805C; --green-soft: #E5F5EE; --amber: #B45309; --amber-soft: #FEF3E2;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }

  header { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top) + 16px) 16px 14px; position: sticky; top: 0; z-index: 5; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 36px; height: 36px; border-radius: 10px; }
  .top h1 { margin: 0; font-size: 20px; letter-spacing: -0.3px; }
  .top .sub { font-size: 12.5px; color: #A9B4C7; margin-top: 1px; }
  .hbtn { background: var(--navy-2); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; position: relative; flex: none; }
  .hbtn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .hbtn.on .dot { background: #3DDC97; }
  .hbtn .count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .search { margin-top: 12px; display: flex; align-items: center; gap: 8px; background: var(--navy-2); border-radius: 12px; padding: 0 12px; }
  .search input { flex: 1; background: transparent; border: 0; color: #fff; padding: 11px 0; outline: none; font-size: 15px; }
  .search input::placeholder { color: #8B97AB; }
  .search .x { background: none; border: 0; color: #8B97AB; font-size: 18px; padding: 4px; display: none; }

  .cats { display: flex; gap: 8px; padding: 12px 16px 2px; overflow-x: auto; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
  .chip .n { color: var(--muted); font-weight: 500; }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip.active .n { color: #B9C0CC; }
  .chip:disabled { opacity: .4; }
  .summary { display: flex; align-items: center; gap: 8px; padding: 8px 16px 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .summary .tag { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--ink); font-weight: 600; font-size: 12.5px; }
  .summary button.link { background: none; border: 0; color: var(--red); font-weight: 700; padding: 3px 0; font-size: 13px; }

  main { padding: 6px 16px calc(env(safe-area-inset-bottom) + 90px); max-width: 720px; margin: 0 auto; }
  .section { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 16px 4px 10px; }

  .feature { background: var(--card); border-radius: 22px; overflow: hidden; margin-bottom: 12px; display: block; color: inherit; text-decoration: none;
    box-shadow: 0 1px 2px rgba(16,27,45,.05), 0 10px 30px rgba(16,27,45,.08); }
  .feature .ph { height: 160px; background: #fff; display: grid; place-items: center; position: relative; border-bottom: 1px solid var(--line); }
  .feature .ph img { max-height: 140px; max-width: 80%; object-fit: contain; }
  .feature .body { padding: 14px 16px 16px; }
  .feature .name { font-size: 18px; font-weight: 750; letter-spacing: -.2px; margin: 6px 0 8px; }
  .feature .price { font-size: 28px; }

  .card { background: var(--card); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; display: flex; gap: 14px;
    color: inherit; text-decoration: none; box-shadow: 0 1px 2px rgba(16,27,45,.05), 0 4px 14px rgba(16,27,45,.05); }
  .card .ph { width: 88px; height: 88px; border-radius: 14px; background: #fff; border: 1px solid var(--line); flex: none; display: grid; place-items: center; overflow: hidden; }
  .card .ph img { width: 100%; height: 100%; object-fit: contain; }
  .ph-fallback { font-size: 30px; }
  .card .info { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .card .name { font-weight: 650; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 3px 0 6px; }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; flex-wrap: wrap; }
  .store-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price { font-size: 20px; font-weight: 800; letter-spacing: -.4px; }
  .was { color: var(--muted); text-decoration: line-through; font-size: 13.5px; }
  .orig { color: var(--muted); font-size: 12px; }
  .off { background: var(--red); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 8px; letter-spacing: 0; }
  .feature .off { position: absolute; top: 14px; left: 14px; font-size: 14px; padding: 5px 10px; border-radius: 10px; }
  .foot { margin-top: auto; padding-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .pill.time { background: var(--green-soft); color: var(--green); }
  .pill.soon { background: var(--amber-soft); color: var(--amber); }
  .pill.last { background: var(--red-soft); color: var(--red); }
  .pill.oos { background: #F1F2F5; color: #8A90A0; }
  .pill.new { background: var(--navy); color: #fff; }
  .more { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 13px; font-weight: 700; color: var(--ink); margin-top: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .empty .big { font-size: 42px; margin-bottom: 8px; }
  .empty b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(16,27,45,.45); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; z-index: 21;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 24px); max-width: 720px; margin: 0 auto; transform: translateY(105%); transition: transform .25s ease; max-height: 88vh; overflow-y: auto; }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .sheet h3 { font-size: 12.5px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 1px solid var(--line); background: #fff; padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .opt.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .wl { border: 1px solid var(--line); border-radius: 16px; padding: 2px 14px; margin-bottom: 12px; }
  .wl .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .wl .row:last-child { border-bottom: 0; }
  .ok { color: var(--green); font-weight: 650; } .bad { color: var(--red); font-weight: 650; }
  .steps { margin: 0 0 16px; padding-left: 20px; } .steps li { margin-bottom: 8px; }
  .btn { border: 0; background: var(--red); color: #fff; font-weight: 700; padding: 10px 14px; border-radius: 12px; font-size: 14px; white-space: nowrap; }
  .btn.ghost { background: var(--bg); color: var(--ink); }
  .full { width: 100%; padding: 14px; font-size: 15px; margin-top: 8px; display: block; text-align: center; text-decoration: none; }
  .toggle { position: relative; width: 46px; height: 28px; flex: none; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; background: #D5D9E0; border-radius: 14px; transition: .2s; }
  .toggle span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle input:checked + span { background: var(--green); }
  .toggle input:checked + span::before { transform: translateX(18px); }
  .cat-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cat-row:last-child { border-bottom: 0; }
  .cat-row .head { display: flex; justify-content: space-between; align-items: center; font-weight: 650; }
  .cat-row .limits { display: flex; gap: 8px; margin-top: 8px; }
  .cat-row .limits label { flex: 1; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .field { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 15px; width: 100%; background: #fff; color: var(--ink); }
  .addrow { display: flex; gap: 8px; margin-top: 8px; }
  .xbtn { background: var(--bg); border: 0; border-radius: 8px; width: 30px; height: 30px; font-size: 16px; color: var(--muted); }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%) translateY(150%);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; z-index: 30; transition: transform .25s, opacity .25s; max-width: 90vw; opacity: 0; visibility: hidden; }
  .toast.show { transform: translateX(-50%); opacity: 1; visibility: visible; }
  .skeleton { height: 112px; border-radius: var(--radius); background: linear-gradient(90deg,#eceff3 25%,#f6f7f9 50%,#eceff3 75%); background-size: 200% 100%; animation: sh 1.2s infinite; margin-bottom: 10px; }
  @keyframes sh { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icons/icon-192.png" alt="">
    <div style="flex:1;min-width:0">
      <h1>TT Deals</h1>
      <div class="sub" id="updated">Checking for specials…</div>
    </div>
    <button class="hbtn" id="filterBtn" aria-label="Filters">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span class="count" id="filterCount" style="display:none"></span>
    </button>
    <button class="hbtn" id="bellBtn" aria-label="Alerts">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot"></span>
    </button>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B97AB" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search e.g. Dignics, Viscaria, Lezoline" autocomplete="off">
    <button class="x" id="qx" aria-label="Clear">×</button>
  </div>
</header>

<div class="cats" id="cats"></div>
<div class="summary" id="summary"></div>

<main id="main">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const VAPID_PUBLIC = "BM9Cz8aVmt8DF4ltw3uH705wqUuTyouaieTXf19EaOUex8fnTokPiileL51oL3Ow7Ahul0mvkOrFxONu8jc4yP8";
const REPO = "yashiljaimungal4/tt-specials";
const CATS = [
  ["all", "All", "🏓"], ["watch", "Watchlist", "⭐"], ["rubber", "Rubbers", "🔴"], ["blade", "Blades", "🪵"], ["racket", "Rackets", "🏓"],
  ["balls", "Balls", "⚪"], ["clothing", "Clothing", "👕"], ["shoes", "Shoes", "👟"], ["bags", "Bags & cases", "🎒"],
  ["accessories", "Accessories", "🧴"], ["robots", "Robots", "🤖"], ["tables", "Tables & nets", "🟦"],
];
const CAT_NAME = Object.fromEntries(CATS.map(([k, n]) => [k, n]));
const ICON = Object.fromEntries(CATS.map(([k, , i]) => [k, i]));
const PRICE_OPTS = [0, 250, 500, 1000, 2000, 5000];
const PCT_OPTS = [0, 10, 20, 30, 40, 50];
const SORTS = [["discount", "Biggest discount"], ["low", "Lowest price"], ["ending", "Ending soonest"], ["new", "Newest"]];
const DOTS = ["#3B82F6", "#F59E0B", "#10B981", "#8B5CF6", "#EF4444", "#0EA5E9", "#EC4899", "#84CC16", "#F97316"];
const PAGE = 40;

const defaults = { max: 0, minPct: 0, storesOff: [], inStock: false, sort: "discount" };
let F = load("ttd-filters", defaults);
const state = { data: null, cat: "all", q: "", shown: PAGE };
const $ = (s) => document.querySelector(s);
const fmtR = (n) => "R" + Math.round(n).toLocaleString("en-ZA").replace(/,/g, " ");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function load(k, d) { try { return Object.assign({}, d, JSON.parse(localStorage.getItem(k) || "{}")); } catch (_) { return { ...d }; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2800); }
const dot = (store) => { const names = (state.data?.store_list || []).map((x) => x.name); const i = Math.max(0, names.indexOf(store)); return `<span class="store-dot" style="background:${DOTS[i % DOTS.length]}"></span>`; };

function timeLeft(end) {
  if (!end) return null;
  const ms = new Date(end) - Date.now();
  if (ms <= 0) return { text: "Ended", cls: "oos" };
  const h = Math.floor(ms / 3.6e6), d = Math.floor(h / 24), m = Math.floor((ms % 3.6e6) / 6e4);
  if (h >= 24) return { text: `Ends in ${d}d ${h % 24}h`, cls: "time" };
  return { text: (h < 6 ? "Last hours · " : "Last day · ") + (h >= 1 ? `${h}h ${m}m` : `${m}m`) + " left", cls: h < 6 ? "last" : "soon" };
}
const clock = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function badges(d) {
  const out = [];
  const t = timeLeft(d.end);
  if (t) out.push(`<span class="pill ${t.cls}">${clock}${t.text}</span>`);
  else out.push(`<span class="pill">${{ clearance: "Clearance · while stock lasts", promo: "Weekly special", monthly: "Monthly sale", weekly: "Weekly special" }[d.where] || "On sale"}</span>`);
  if (!d.in_stock) out.push('<span class="pill oos">Out of stock</span>');
  if (Date.now() - new Date(d.first_seen) < 864e5) out.push('<span class="pill new">New</span>');
  return out.join("");
}
function photo(d) {
  const fb = ICON[d.kind] || "🏓";
  return d.image ? `<img src="${esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=ph-fallback>${fb}</span>'">` : `<span class="ph-fallback">${fb}</span>`;
}
function priceBlock(d) {
  return `<div class="prices"><span class="price">${fmtR(d.price_zar)}</span>` + (d.was_zar ? `<span class="was">${fmtR(d.was_zar)}</span>` : "") +
    (d.price_orig ? `<span class="orig">${esc(d.price_orig)}</span>` : "") + `</div>`;
}
function card(d) {
  return `<a class="card" href="${esc(d.url)}" target="_blank" rel="noopener" id="${esc(d.id)}"><div class="ph">${photo(d)}</div><div class="info">
    <div class="meta">${dot(d.store)}${esc(d.store)} · ${esc(CAT_NAME[d.kind] || "")}${d.pct ? ` <span class="off">−${d.pct}%</span>` : ""}</div>
    <div class="name">${esc(d.name)}</div>${priceBlock(d)}<div class="foot">${badges(d)}</div></div></a>`;
}
function feature(d) {
  return `<a class="feature" href="${esc(d.url)}" target="_blank" rel="noopener" id="${esc(d.id)}"><div class="ph">${photo(d)}${d.pct ? `<span class="off">−${d.pct}%</span>` : ""}</div>
    <div class="body"><div class="meta">${dot(d.store)}${esc(d.store)} · ⭐ ${esc(d.watch)}</div><div class="name">${esc(d.name)}</div>${priceBlock(d)}<div class="foot">${badges(d)}</div></div></a>`;
}

// ---------- filtering ----------
function passFilters(d, ignoreCat) {
  if (F.storesOff.includes(d.store)) return false;
  if (F.max && d.price_zar > F.max) return false;
  if (F.minPct && d.pct < F.minPct) return false;
  if (F.inStock && !d.in_stock) return false;
  if (state.q) {
    const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const hay = (d.name + " " + d.store + " " + (CAT_NAME[d.kind] || "")).toLowerCase();
    if (!words.every((w) => hay.includes(w))) return false;
  }
  if (!ignoreCat) {
    if (state.cat === "watch") return !!d.watch;
    if (state.cat !== "all") return d.kind === state.cat;
  }
  return true;
}
function sorted(list) {
  const s = F.sort, k = {
    discount: (a, b) => b.pct - a.pct || a.price_zar - b.price_zar,
    low: (a, b) => a.price_zar - b.price_zar,
    ending: (a, b) => (a.end ? new Date(a.end) : 9e15) - (b.end ? new Date(b.end) : 9e15) || b.pct - a.pct,
    new: (a, b) => new Date(b.first_seen) - new Date(a.first_seen) || b.pct - a.pct,
  }[s];
  return list.slice().sort(k);
}
function activeFilterCount() { return (F.max ? 1 : 0) + (F.minPct ? 1 : 0) + (F.storesOff.length ? 1 : 0) + (F.inStock ? 1 : 0); }

function renderCats() {
  const base = state.data.deals.filter((d) => passFilters(d, true));
  $("#cats").innerHTML = CATS.map(([k, n]) => {
    const c = k === "all" ? base.length : k === "watch" ? base.filter((d) => d.watch).length : base.filter((d) => d.kind === k).length;
    if (!c && k !== "all" && k !== state.cat) return "";
    return `<button class="chip${state.cat === k ? " active" : ""}" data-cat="${k}">${n}<span class="n">${c}</span></button>`;
  }).join("");
  const tags = [];
  if (F.max) tags.push(`Under ${fmtR(F.max)}`);
  if (F.minPct) tags.push(`${F.minPct}%+ off`);
  if (F.storesOff.length) tags.push(`${(state.data.store_list.length - F.storesOff.length)} shops`);
  if (F.inStock) tags.push("In stock");
  const sortName = SORTS.find((x) => x[0] === F.sort)[1];
  $("#summary").innerHTML = (tags.length ? tags.map((t) => `<span class="tag">${t}</span>`).join("") + `<button class="link" onclick="resetFilters()">Clear</button>` : "") +
    `<span style="margin-left:auto">Sort: <button class="link" onclick="openFilters()">${sortName}</button></span>`;
  const n = activeFilterCount();
  $("#filterCount").style.display = n ? "grid" : "none";
  $("#filterCount").textContent = n;
}

function render() {
  const d = state.data; if (!d) return;
  renderCats();
  const list = sorted(d.deals.filter((x) => passFilters(x)));
  let html = "";
  if (!list.length) {
    html = `<div class="empty"><div class="big">🏓</div><b>No specials match</b>${activeFilterCount() || state.q ? "Try a higher price limit, a lower % off, or clearing the search." : "Nothing on special here right now. Checks run 5 times a day."}</div>`;
  } else {
    const watch = state.cat === "all" && !state.q ? list.filter((x) => x.watch) : [];
    const rest = watch.length ? list.filter((x) => !x.watch) : list;
    if (watch.length) html += `<div class="section">⭐ Your watchlist</div>` + watch.map(feature).join("") + `<div class="section">All specials · ${rest.length}</div>`;
    else html += `<div class="section">${state.cat === "all" ? "All specials" : esc(CAT_NAME[state.cat])} · ${list.length}</div>`;
    html += rest.slice(0, state.shown).map(state.cat === "watch" ? feature : card).join("");
    if (rest.length > state.shown) html += `<button class="more" onclick="showMore()">Show more (${rest.length - state.shown} left)</button>`;
  }
  $("#main").innerHTML = html;
}
window.showMore = () => { state.shown += PAGE * 2; render(); };

function setCat(k, push = true) {
  state.cat = k; state.shown = PAGE;
  if (push) history.replaceState(null, "", k === "all" ? location.pathname : "#" + k);
  render(); window.scrollTo({ top: 0 });
}
$("#cats").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) setCat(b.dataset.cat); });
let qt;
$("#q").addEventListener("input", (e) => {
  clearTimeout(qt); $("#qx").style.display = e.target.value ? "block" : "none";
  qt = setTimeout(() => { state.q = e.target.value.trim(); state.shown = PAGE; render(); }, 150);
});
$("#qx").onclick = () => { $("#q").value = ""; state.q = ""; $("#qx").style.display = "none"; render(); };

function setUpdated() {
  if (!state.data) return;
  const u = new Date(state.data.updated), mins = Math.round((Date.now() - u) / 6e4);
  const ago = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins / 60)} h ago` : u.toLocaleDateString("en-ZA", { day: "numeric", month: "short" });
  const shops = Object.values(state.data.stores).filter(Boolean).length;
  $("#updated").textContent = `${state.data.deals.length} specials · ${shops} shops · ${ago}`;
}
async function load_() {
  try { const r = await fetch("deals.json?t=" + Date.now(), { cache: "no-store" }); state.data = await r.json(); }
  catch (e) { if (!state.data) { $("#main").innerHTML = `<div class="empty"><div class="big">📡</div><b>Can't load deals</b>Check your connection and try again.</div>`; return; } }
  const h = location.hash.slice(1);
  if (CATS.some(([k]) => k === h)) setCat(h, false); else render();
  setUpdated();
  const el = h && document.getElementById(h); if (el) el.scrollIntoView({ block: "center" });
}

// ---------- sheets ----------
function openSheet(html) { $("#sheetBody").innerHTML = html; $("#sheetBg").style.display = "block"; requestAnimationFrame(() => $("#sheet").classList.add("open")); }
function closeSheet() { $("#sheet").classList.remove("open"); setTimeout(() => ($("#sheetBg").style.display = "none"), 250); }
$("#sheetBg").onclick = closeSheet;

function opts(name, values, current, label) {
  return `<div class="opts">` + values.map((v) => `<button class="opt${v === current ? " active" : ""}" data-f="${name}" data-v="${v}">${label(v)}</button>`).join("") + `</div>`;
}
function openFilters() {
  const stores = state.data?.store_list || [];
  openSheet(`<h2>Filter specials</h2><p>Saved on this phone only.</p>
    <h3>Max price</h3>${opts("max", PRICE_OPTS, F.max, (v) => (v ? "Under " + fmtR(v) : "Any"))}
    <h3>Minimum discount</h3>${opts("minPct", PCT_OPTS, F.minPct, (v) => (v ? v + "%+" : "Any"))}
    <div class="note">Some shops (Dandoy, Butterfly US) don't show the old price, so their specials have no % and are hidden when a minimum is set.</div>
    <h3>Sort by</h3><div class="opts">${SORTS.map(([k, n]) => `<button class="opt${F.sort === k ? " active" : ""}" data-f="sort" data-v="${k}">${n}</button>`).join("")}</div>
    <h3>Shops</h3><div class="wl">${stores.map((s) => `<div class="row"><span>${dot(s.name)}&nbsp; ${esc(s.name)} <span style="color:var(--muted);font-size:12px">${esc(s.country)}</span></span>
      <label class="toggle"><input type="checkbox" data-store="${esc(s.name)}" ${F.storesOff.includes(s.name) ? "" : "checked"}><span></span></label></div>`).join("")}</div>
    <div class="wl"><div class="row"><span>In stock only</span><label class="toggle"><input type="checkbox" id="fStock" ${F.inStock ? "checked" : ""}><span></span></label></div></div>
    <button class="btn full" onclick="closeSheet()">Show ${countMatching()} specials</button>
    <button class="btn ghost full" onclick="resetFilters();closeSheet()">Reset filters</button>`);
}
window.openFilters = openFilters;
function countMatching() { return state.data ? state.data.deals.filter((d) => passFilters(d)).length : 0; }
$("#sheetBody").addEventListener("click", (e) => {
  const b = e.target.closest(".opt[data-f]"); if (!b) return;
  const f = b.dataset.f; F[f] = f === "sort" ? b.dataset.v : Number(b.dataset.v);
  b.parentElement.querySelectorAll(".opt").forEach((x) => x.classList.toggle("active", x === b));
  applyFilters();
});
$("#sheetBody").addEventListener("change", (e) => {
  if (e.target.dataset.store) {
    const n = e.target.dataset.store;
    F.storesOff = e.target.checked ? F.storesOff.filter((x) => x !== n) : [...F.storesOff, n];
    applyFilters();
  } else if (e.target.id === "fStock") { F.inStock = e.target.checked; applyFilters(); }
});
function applyFilters() {
  save("ttd-filters", F); state.shown = PAGE; render();
  const b = document.querySelector("#sheetBody .btn.full"); if (b && b.textContent.startsWith("Show")) b.textContent = `Show ${countMatching()} specials`;
}
window.resetFilters = () => { F = { ...defaults }; save("ttd-filters", F); render(); };
$("#filterBtn").onclick = openFilters;

// ---------- alerts + alert settings (owner) ----------
let P = null; // alert prefs being edited
function prefsFromData() {
  const ap = JSON.parse(JSON.stringify(state.data?.alert_prefs || {}));
  ap.categories = ap.categories || {};
  for (const [k] of CATS.slice(2)) ap.categories[k] = Object.assign({ on: false, max_zar: null, min_pct: 0 }, ap.categories[k] || {});
  ap.watch_extra = ap.watch_extra || []; ap.stores_off = ap.stores_off || [];
  if (ap.watch_items_on === undefined) ap.watch_items_on = true;
  return ap;
}
function openAlerts() {
  P = prefsFromData();
  const subscribed = localStorage.getItem("ttd-subscribed");
  let top;
  if (subscribed) top = `<h2>Alerts are on ✅</h2><p>This phone is told when something matching the settings below goes on special. Checks run at 07:07, 12:07, 13:37, 16:07 and 20:07.</p>`;
  else if (isIOS && !standalone) top = `<h2>Add TT Deals to your Home Screen</h2><p>On iPhone, alerts only work from the installed app.</p><ol class="steps"><li>Tap <b>Share</b> in Safari</li><li><b>Add to Home Screen</b> → <b>Add</b></li><li>Open <b>TT Deals</b> from your Home Screen and tap the bell again</li></ol>`;
  else if (!pushSupported) top = `<h2>Alerts not supported here</h2><p>Open this page in Chrome (Android) or install it to your Home Screen (iPhone).</p>`;
  else top = `<h2>Turn on alerts</h2><p>For the app owner: allow notifications, then confirm on GitHub. You'll get a test alert straight after.</p><button class="btn full" onclick="subscribe(this)">Allow notifications</button>`;
  openSheet(top + `<div id="prefsEditor">${prefsHtml()}</div>`);
}
function prefsHtml() {
  const watchFixed = (state.data?.watch_items || []).filter((x) => !P.watch_extra.some((w) => w.label === x));
  return `<h3>Alert settings</h3><p style="margin:0 0 10px">Choose what alerts you. Browsing filters above don't change these.</p>
    <div class="wl"><div class="row"><span><b>⭐ Watched items</b><br><span class="note" style="margin:0">Always alert, any price</span></span><label class="toggle"><input type="checkbox" data-p="watch_on" ${P.watch_items_on ? "checked" : ""}><span></span></label></div>
    ${watchFixed.map((w) => `<div class="row"><span>${esc(w)}</span><span class="note" style="margin:0">built in</span></div>`).join("")}
    ${P.watch_extra.map((w, i) => `<div class="row"><span>${esc(w.label)}</span><button class="xbtn" data-p="rm" data-i="${i}">×</button></div>`).join("")}
    <div class="addrow" style="padding-bottom:10px"><input class="field" id="addWatch" placeholder="Add item, e.g. Viscaria or Rakza 7" maxlength="60"><button class="btn" data-p="add">Add</button></div></div>
    <div class="wl">${CATS.slice(2).map(([k, n, ic]) => { const c = P.categories[k]; return `<div class="cat-row"><div class="head"><span>${ic} ${n}</span><label class="toggle"><input type="checkbox" data-p="on" data-k="${k}" ${c.on ? "checked" : ""}><span></span></label></div>
      ${c.on ? `<div class="limits"><label>Max price (R)<input class="field" inputmode="numeric" data-p="max" data-k="${k}" value="${c.max_zar || ""}" placeholder="Any"></label>
      <label>Min % off<select class="field" data-p="pct" data-k="${k}">${PCT_OPTS.map((v) => `<option value="${v}" ${Number(c.min_pct || 0) === v ? "selected" : ""}>${v ? v + "%+" : "Any"}</option>`).join("")}</select></label></div>` : ""}</div>`; }).join("")}</div>
    <h3>Shops to alert from</h3><div class="wl">${(state.data?.store_list || []).map((s) => `<div class="row"><span>${dot(s.name)}&nbsp; ${esc(s.name)}</span><label class="toggle"><input type="checkbox" data-p="store" data-k="${esc(s.name)}" ${P.stores_off.includes(s.name) ? "" : "checked"}><span></span></label></div>`).join("")}</div>
    <button class="btn full" onclick="savePrefs()">Save alert settings</button>
    <div class="note">Saving opens GitHub (where your monitor runs) with the settings filled in. Tap <b>Submit</b>. Only the app owner's GitHub account can change them; a check runs straight after.</div>
    ${shopsHtml()}`;
}
function shopsHtml() {
  const d = state.data; if (!d) return "";
  return `<h3>Shops checked</h3><div class="wl">` + d.store_list.map((st) => { const ok = d.stores[st.name], n = d.deals.filter((x) => x.store === st.name).length;
    return `<div class="row"><span>${dot(st.name)}&nbsp; ${esc(st.name)} <span style="color:var(--muted);font-size:12px">${esc(st.country)}</span></span><span class="${ok ? "ok" : "bad"}">${ok ? (n ? n + " deals" : "OK") : "can't read"}</span></div>`; }).join("") + `</div>`;
}
function rerenderPrefs() { const y = $("#sheet").scrollTop; $("#prefsEditor").innerHTML = prefsHtml(); $("#sheet").scrollTop = y; }
$("#sheetBody").addEventListener("change", (e) => {
  const t = e.target, p = t.dataset.p; if (!p || !P) return;
  if (p === "watch_on") P.watch_items_on = t.checked;
  if (p === "on") { P.categories[t.dataset.k].on = t.checked; rerenderPrefs(); }
  if (p === "max") P.categories[t.dataset.k].max_zar = Number(String(t.value).replace(/[^0-9]/g, "")) || null;
  if (p === "pct") P.categories[t.dataset.k].min_pct = Number(t.value);
  if (p === "store") P.stores_off = t.checked ? P.stores_off.filter((x) => x !== t.dataset.k) : [...P.stores_off, t.dataset.k];
});
$("#sheetBody").addEventListener("click", (e) => {
  const b = e.target.closest("[data-p]"); if (!b || !P || b.tagName === "INPUT" || b.tagName === "SELECT") return;
  if (b.dataset.p === "add") { const v = $("#addWatch").value.trim(); if (v) { P.watch_extra.push({ label: v }); rerenderPrefs(); } }
  if (b.dataset.p === "rm") { P.watch_extra.splice(Number(b.dataset.i), 1); rerenderPrefs(); }
});
window.savePrefs = () => {
  document.querySelectorAll('[data-p="max"]').forEach((i) => (P.categories[i.dataset.k].max_zar = Number(String(i.value).replace(/[^0-9]/g, "")) || null));
  const out = { watch_items_on: P.watch_items_on, watch_extra: P.watch_extra.map((w) => ({ label: w.label })), categories: P.categories, stores_off: P.stores_off };
  const body = "Tap **Submit new issue** to save these alert settings. A check runs straight after.\n\n```json\n" + JSON.stringify(out) + "\n```";
  window.open(`https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Settings")}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
  toast("Opening GitHub - tap Submit to save");
};
$("#bellBtn").onclick = openAlerts;

function b64ToBytes(b64) { const p = "=".repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); }
async function subscribe(btn) {
  try {
    btn.disabled = true; btn.textContent = "Asking permission…";
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { btn.disabled = false; btn.textContent = "Allow notifications"; toast("Notifications were blocked. Allow them in your phone settings."); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    const device = isIOS ? "iPhone" : /android/i.test(navigator.userAgent) ? "Android" : "Browser";
    const body = "Tap **Submit new issue** below to connect this phone to your deals alerts.\n\n```json\n" + JSON.stringify({ device, subscription: sub.toJSON() }) + "\n```";
    const url = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Subscribe " + device)}&body=${encodeURIComponent(body)}`;
    localStorage.setItem("ttd-subscribed", "1");
    btn.outerHTML = `<p><b>Last step:</b> GitHub opens with everything filled in. Tap <b>Submit new issue</b>. Your test alert arrives within a minute or two, then a full check runs.</p><a class="btn full" href="${url}" target="_blank" rel="noopener">Open GitHub to confirm</a>`;
    $("#bellBtn").classList.add("on");
  } catch (e) { btn.disabled = false; btn.textContent = "Allow notifications"; toast("Couldn't turn on alerts: " + e.message); }
}
window.subscribe = subscribe;

if (localStorage.getItem("ttd-subscribed")) $("#bellBtn").classList.add("on");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
load_();
setInterval(setUpdated, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load_(); });
</script>
</body>
</html>
